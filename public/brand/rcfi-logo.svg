  <text x="56" y="54" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="8.5" fill="#047857" letter-spacing="0.1">Innovation Limited</text>
